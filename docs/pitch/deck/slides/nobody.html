<p class="eyebrow">THE PROBLEM</p>
<p class="big in" style="--i:0">The person selling writes the listing.</p>
<p class="big in" style="--i:2">Nobody checks it.</p>
<aside>Say it slowly, then stop. “The person selling writes the listing, and nobody checks it.” Look at the judges. “You have all been this person.”</aside>
